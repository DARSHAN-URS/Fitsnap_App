name: Deploy to App Store Connect

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Production release'
  push:
    branches: [ main ]

jobs:
  deploy-app-store:
    name: Build & Upload to App Store
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prebuild iOS dependencies and engine
        run: flutter build ios --release --no-codesign

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install Fastlane
        run: |
          gem install bundler
          gem install fastlane

      - name: Prepare App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          
          python3 -c "
          import os, base64

          raw = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          key_id = os.environ.get('APP_STORE_CONNECT_KEY_ID', '').strip()
          out_path = os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8')

          # 1. Try Base64 decode
          try:
              decoded = base64.b64decode(raw).decode('utf-8')
              if 'BEGIN' in decoded:
                  raw = decoded
          except Exception:
              pass

          # 2. Replace literal '\n' if newline characters were escaped
          raw = raw.replace('\\n', '\n').strip() + '\n'

          # 3. Ensure valid PEM header
          if not raw.startswith('-----BEGIN'):
              raw = '-----BEGIN PRIVATE KEY-----\n' + raw
          if not raw.strip().endswith('-----END PRIVATE KEY-----') and not raw.strip().endswith('-----END EC PRIVATE KEY-----'):
              raw = raw.strip() + '\n-----END PRIVATE KEY-----\n'

          with open(out_path, 'w') as f:
              f.write(raw)
          print(f'Successfully formatted API key at {out_path} ({len(raw)} bytes)')
          "
          chmod 600 "$KEY_FILE"

      - name: Run Fastlane to Sign and Deploy
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: fastlane release

      - name: Upload Production IPA as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SabTrack-Production-Signed-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 14
